name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Build & restart backend on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/app || { echo 'Brak ~/app na serwerze – najpierw git clone (server-setup.md, pkt 7)'; exit 1; }
            git fetch origin main
            git reset --hard origin/main
            docker compose up --build -d --remove-orphans db backend caddy
            docker image prune -f

      - name: Smoke test GET /health
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Brak zmiennej API_URL (Settings → Secrets and variables → Actions → Variables)"; exit 1
          fi
          url="${{ vars.API_URL }}/health"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$url"; then
              echo; echo "OK: $url"; exit 0
            fi
            echo "attempt $i failed, retrying in 5s..."; sleep 5
          done
          echo "::error::API did not come up at $url"; exit 1
