services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_ADDRESS: ${API_ADDRESS:-:8000}
      PGADMIN_ADDRESS: ${PGADMIN_ADDRESS:-:5050}
      DOZZLE_ADDRESS: ${DOZZLE_ADDRESS:-:9999}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # pgweb zastapil pgadmina: ~8 MB RAM zamiast ~238 MB.
  # Parametry polaczenia ida flagami, a nie DATABASE_URL, bo URL rozsypuje sie
  # przy hasle ze znakami @ : / #.
  # UWAGA: pgweb bez skonfigurowanego loginu wpuszcza KAZDEGO (HTTP 200),
  # dlatego ponizsze ${...:?} celowo wywala deploy, gdy brakuje hasla w .env.
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: ["tools"]
    command:
      - --host=db
      - --port=5432
      - --user=${POSTGRES_USER}
      - --pass=${POSTGRES_PASSWORD}
      - --db=${POSTGRES_DB}
      - --ssl=disable
      - --lock-session
    environment:
      PGWEB_AUTH_USER: ${PGADMIN_EMAIL:?pgweb wymaga PGADMIN_EMAIL w .env}
      PGWEB_AUTH_PASS: ${PGADMIN_PASSWORD:?pgweb wymaga PGADMIN_PASSWORD w .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    profiles: ["tools"]
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data:ro
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
